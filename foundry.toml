[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "settlement-deductions/=lib/settlement-deductions/src/",
]

# Integration with the real ERC-8414 (with the settlement-deduction hook), ERC-8436, the
# 8436-8414 adapter, and ERC-8471 with its 8436 bridge, compiled as the 8414 and 8436
# repositories compile them (via-IR, runs 1).
# `FOUNDRY_PROFILE=integration forge test`. The size limit is raised for the test EVM only:
# these settings are not the deployment settings of any of the contracts.
[profile.integration]
test = "integration"
via_ir = true
optimizer_runs = 1
code_size_limit = 196608
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "settlement-deductions/=lib/settlement-deductions/src/",
  "acdf/=lib/acd-framework/assets/erc-acdf/contracts/",
  "acdf-test/=lib/acd-framework/test/",
  "task-token/=lib/task-token-standard/",
  "adrf/=lib/ai-dispute-resolution/assets/erc-adrf/contracts/",
  "adrf-test/=lib/ai-dispute-resolution/test/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = true
